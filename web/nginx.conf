server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        # Cloudflare puts the visitor's IP in CF-Connecting-IP; handing it on as X-Forwarded-For lets the
        # API's per-IP submit rate limit see real clients instead of this proxy.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Vite fingerprints everything under assets/, so those files never change under the same name.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
