name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Runners are pinned rather than ubuntu-latest so an image migration (e.g. to Ubuntu 26)
# is a deliberate one-line change here, not a surprise CI break.
jobs:
  api:
    name: API build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AiMusicDetector.slnx

      - name: Build
        run: dotnet build AiMusicDetector.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AiMusicDetector.slnx --no-build --configuration Release

  ml:
    name: ML service
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Test
        run: pytest

  web:
    name: Web build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
