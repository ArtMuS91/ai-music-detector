services:
  postgres:
    image: postgres:17-alpine
    container_name: aimusicdetector-postgres
    environment:
      POSTGRES_DB: aimusicdetector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aimusicdetector"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    container_name: aimusicdetector-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=aimusicdetector;Username=postgres;Password=postgres
      # Read from the gitignored .env next to this file; web research is skipped when unset.
      Groq__ApiKey: ${GROQ_API_KEY:-}
    ports:
      - "5214:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
